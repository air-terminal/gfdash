{% extends "app/base_site.html" %}

{% block stylesheets %}
  {{ block.super }}
  <!-- bootstrap-datepicker -->
  <link href="/static/gf_vendors/bootstrap-datepicker/dist/css/bootstrap-datepicker.min.css" rel="stylesheet"  type="text/css">
  <link href="/static/gf_vendors/datatables.net-bs/datatables.min.css" rel="stylesheet"  type="text/css">

  <link href="/static/build/css/custom_gf.css" rel="stylesheet"  type="text/css">
{% endblock stylesheets %}

{% block content %}
  <div class="right_col" role="main">
    <input type="hidden" id="calendar_saveval" value="">
    <input type="hidden" id="calendar_initval" value="">
    <input type="hidden" id="calendar_from" value="">
    <input type="hidden" id="calendar_to" value="">

    <div class="">
      <div class="row">
        <div class="col-md-12 col-sm-12 col-xs-12">
          <div class="x_panel">
<!-- 1. 上部コントロールエリアをFlexbox構造に最適化（iPad・PCで右寄せ） -->
            <div class="x_title gf_dashboard_header_flex">
              <div class="gf_header_title">
                <h2 id="gf_header"><small class="count" id="txt001"></small></h2>
              </div>

              <div class="gf_header_controls">
                <div id="toggleBtn" class="btn-group" data-toggle="buttons">
                  <label class="btn btn-default" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
                    <input type="radio" name="chart_mode" value="year" onchange="btnToggleChartMode()" checked>年比較
                  </label>
                  <label class="btn btn-primary" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
                    <input type="radio" name="chart_mode" value="month" onchange="btnToggleChartMode()">年間
                  </label>
                  <label class="btn btn-primary" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
                    <input type="radio" name="chart_mode" value="cf_month" onchange="btnToggleChartMode()">月比較
                  </label>
                  <label class="btn btn-primary" data-toggle-class="btn-primary" data-toggle-passive-class="btn-default">
                    <input type="radio" name="chart_mode" value="day" onchange="btnToggleChartMode()">月間
                  </label>
                </div>

                <div class="gf_custom_menu_parts" id="230_calendar">
                  <button id="tbn_prev_month" type="button" class="btn btn-default glyphicon glyphicon-chevron-left" onclick="sub320_btnPrevMonth()"></button>
                  <div class="input-group date" style="margin-bottom: 0px;">
                    <span class="input-group-addon"><i class="glyphicon glyphicon-calendar fa-solid fa-calendar-days"></i></span>
                    <input id="gf_calendar"  type="text" class="form-control" style="width:7em;">
                  </div>
                  <button id="tbn_next_month" type="button" class="btn btn-default glyphicon glyphicon-chevron-right" onclick="sub320_btnNextMonth()"></button>
                </div>
              </div>
              <div class="clearfix"></div>
            </div>
            <br>

            <div class="x_content gf_custom">
              <div class="col-md-9 col-sm-12 col-xs-12">
                <!-- 2. グラフエリア（スマホ時のみ横スクロールさせる枠を追加） -->
                <div class="gf_chart_scroll_container">
                  <div class="gf_chart_wrapper_320">
                    <canvas id="chart_plot_mix" ></canvas>
                  </div>
                </div>
              </div>

              <div class="col-md-3 col-sm-12 col-xs-12">
                <!-- 3. テーブルエリア（3列なので画面幅にフィットさせます） -->
                <div class="gf_table_wrapper_320">
                  <table id="datatable_gf" class="table table-striped table-bordered">
                    <thead>
                      <tr>
                        <th id="head_txt1">年</th>
                        <th>客単価</th>
                        <th id="default_year">基準比</th>
                      </tr> <!-- ★閉じタグ抜けを正しく補正 -->
                    </thead>
                    <tfoot class="table-group-divider">
                      <tr id="table_foother">
                        <td class="table-foothead">合計</td>
                        <td id="salesAll"></td>
                        <td id="sagakuAll"></td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <div class="x_content">

            <div class="tiles tile_count gf_custom">

              <div class="graph_option" id="option1_id_tanka">
                <span class="count_top">単価計算オプション</span>
                <!-- icheckライブラリを使っているため、オプション変更時のイベント発生は、initFor232()にて定義 -->
                <div class="radio">
                  <label><input type="radio" class="flat" name="option1_tanka" value="uriage" checked="checked" id="option1_id01">
                    実単価
                  </label>
                </div>
                <div class="radio">
                  <label><input type="radio" class="flat" name="option1_tanka" value="add_coupon" id="option1_id02"> 
                    割引前単価
                  </label>
                </div>
              </div>

              <div class="graph_option" id="option2_id_detail">
                <span class="count_top">グラフオプション</span>
                <!-- icheckライブラリを使っているため、オプション変更時のイベント発生は、initFor232()にて定義 -->
                <div class="radio">
                  <label><input type="radio" class="flat" name="option2_detail" value="gross" checked="checked" id="option2_id01">
                    グロス単価
                  </label>
                </div>
                <div class="radio">
                  <label><input type="radio" class="flat" name="option2_detail" value="member" id="option2_id02"> 
                    メンバー単価
                  </label>
                </div>
                <div class="radio">
                  <label><input type="radio" class="flat" name="option2_detail" value="visitor" id="option2_id03"> 
                    ビジター単価
                  </label>
                </div>
                <!-- スクール単価・内部スクール単価はデータに不備があって実用できない為、年データのみ作って開発中止
                <div class="radio">
                  <label><input type="radio" class="flat" name="option2_detail" value="school" id="option2_id04"> 
                    スクール単価
                  </label>
                </div>
                <div class="radio">
                  <label><input type="radio" class="flat" name="option2_detail" value="internal_school" id="option2_id05"> 
                    内部スクール単価
                  </label>
                </div>
                -->
              </div>

            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}

{% block javascripts %}
  {{ block.super }}
  <!-- Chart.js -->
  <script src="/static/gf_vendors/chart.js-4.4.8/package/dist/chart.umd.js"></script>
  <script src="/static/gf_vendors/chartjs-plugin-annotation/3.1.0/chartjs-plugin-annotation.min.js"></script>

  <!-- Datatables -->
  <script src="/static/gf_vendors/datatables.net-bs/datatables.min.js"></script>
  <script src="/static/vendors/jszip/dist/jszip.min.js"></script>
  <script src="/static/vendors/pdfmake/build/pdfmake.min.js"></script>
  <script src="/static/vendors/pdfmake/build/vfs_fonts.js"></script>

  <!-- bootstrap-datepicker GF カスタム -->
  <script src="/static/gf_vendors/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js"></script>
  <script src="/static/gf_vendors/bootstrap-datepicker/dist/locales/bootstrap-datepicker.ja.min.js"></script>

  <!-- 専用javascriptの宣言 -->
  <script src="/static/build/js/customjs_320.js"></script>

{% endblock javascripts %}
