services:
  db:
    image: postgres:18
    restart: always
    command: -c 'config_file=/etc/postgresql/postgresql.conf' # 追加
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./containers/postgres/sql:/docker-entrypoint-initdb.d
      - ./containers/postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf # 追加
    env_file:
      - .env
    # 必須の値が空のまま起動すると PostgreSQL が初期化を拒否し、Compose は
    # 「container is unhealthy」としか言わない。しかも空のボリュームが残るため、
    # 値を埋めただけでは復旧せず down -v が要る。コンテナを作る前にここで止める。
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env の POSTGRES_PASSWORD が未設定です。.env.example を参照して値を設定してください}
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5    
  web:
    build: .
    restart: always
    entrypoint: /code/entrypoint.sh
    # 本番サーバ。Django 開発サーバ(runserver)は本番利用が非推奨のため gunicorn を使う。
    # 開発中に自動リロードが欲しい場合は docker-compose.override.yml で差し替える(README 参照)。
    #
    # ワーカークラスに gthread を指定している。既定の sync はリクエストの処理中に
    # アービタへハートビートを返さないため、--timeout を超える処理が強制終了される。
    # AIレポート生成のように時間のかかる処理が対象になる。ストリーミング応答でも
    # 回避できない(レスポンスのジェネレータ消費も同じ非通知区間の内側にあるため)。
    # gthread は別スレッドでハートビートを送るので、長い処理を通しつつ
    # 本当にハングしたワーカーの検出は維持される。
    command: gunicorn --chdir gfdash gfdash.wsgi:application --bind 0.0.0.0:8080 --workers ${GUNICORN_WORKERS:-2} --worker-class gthread --threads ${GUNICORN_THREADS:-4} --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - .:/code
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy # DBが完全に起動してから開始するように設定
    env_file:
      - .env
    # SECRET_KEY が空だと Django が起動時に落ち、DJANGO_SUPERUSER_PASSWORD が空だと
    # 初期ユーザーの作成が黙って失敗してログインできなくなる。どちらもログを
    # 読まないと原因が分からないため、起動前に止める。
    environment:
      SECRET_KEY: ${SECRET_KEY:?.env の SECRET_KEY が未設定です。.env.example を参照して値を設定してください}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?.env の DJANGO_SUPERUSER_PASSWORD が未設定です。.env.example を参照して値を設定してください}

volumes:
    postgres-data:
      driver: local

